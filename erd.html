<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>ERD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui;background:#0f172a;color:#e2e8f0;padding:20px}
h1{text-align:center;margin-bottom:20px;font-size:20px}
svg{display:block;margin:0 auto}
.tbl{fill:#1e293b;stroke-width:1.5;rx:8}
.existing{stroke:#3b82f6}
.new{stroke:#10b981}
.junction{stroke:#f59e0b}
.hdr{font-size:13px;font-weight:700;fill:#fff}
.col{font-size:11px;fill:#94a3b8}
.pk{fill:#fbbf24}
.fk{fill:#a78bfa}
.new-col{fill:#34d399;font-style:italic}
.rel{stroke:#475569;stroke-width:1;fill:none;marker-end:url(#arr)}
.rel-n{stroke:#10b981}
.rel-nn{stroke:#f59e0b;stroke-dasharray:4 3}
.label{font-size:10px;fill:#64748b}
.legend{font-size:11px;fill:#94a3b8}
</style>
</head>
<body>
<h1>ERD — Spine + Existing Tables</h1>
<svg viewBox="0 0 880 520" width="100%">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="inherit" stroke-width="1.5"/>
  </marker>
</defs>

<!-- phones -->
<rect class="tbl existing" x="20" y="20" width="160" height="70"/>
<text class="hdr" x="100" y="42" text-anchor="middle" style="fill:#60a5fa">phones</text>
<text class="pk" x="30" y="60">id</text><text class="col" x="120" y="60">PK</text>
<text class="col" x="30" y="76">phone_number, status</text>

<!-- contacts -->
<rect class="tbl existing" x="20" y="130" width="160" height="90"/>
<text class="hdr" x="100" y="152" text-anchor="middle" style="fill:#60a5fa">contacts</text>
<text class="pk" x="30" y="170">id</text><text class="col" x="120" y="170">PK</text>
<text class="fk" x="30" y="186">phone_id</text><text class="col" x="120" y="186">FK→phones</text>
<text class="col" x="30" y="202">name, phone, tag</text>

<!-- calls -->
<rect class="tbl existing" x="240" y="20" width="200" height="110"/>
<text class="hdr" x="340" y="42" text-anchor="middle" style="fill:#60a5fa">calls</text>
<text class="pk" x="250" y="60">id</text><text class="col" x="380" y="60">PK</text>
<text class="fk" x="250" y="76">phone_id, contact_id</text><text class="col" x="410" y="76">FK</text>
<text class="col" x="250" y="92">scenario_id, status</text>
<text class="new-col" x="250" y="108">+ scenario_snapshot</text><text class="col" x="410" y="108">JSONB</text>
<text class="col" x="250" y="120">started_at, duration</text>

<!-- messages -->
<rect class="tbl existing" x="240" y="170" width="200" height="120"/>
<text class="hdr" x="340" y="192" text-anchor="middle" style="fill:#60a5fa">messages</text>
<text class="pk" x="250" y="210">id</text><text class="col" x="380" y="210">PK</text>
<text class="fk" x="250" y="226">phone_id, contact_id</text><text class="col" x="410" y="226">FK</text>
<text class="new-col" x="250" y="242">+ call_id</text><text class="col" x="380" y="242">FK→calls</text>
<text class="col" x="250" y="258">direction (bool)</text>
<text class="col" x="250" y="274">content, message_type</text>

<!-- phone_workers -->
<rect class="tbl new" x="20" y="270" width="160" height="80"/>
<text class="hdr" x="100" y="292" text-anchor="middle" style="fill:#34d399">phone_workers</text>
<text class="pk" x="30" y="310">phone_id</text><text class="col" x="130" y="310">PK</text>
<text class="col" x="30" y="326">service_name</text><text class="col" x="130" y="326">UQ</text>
<text class="col" x="30" y="342">replicas, status</text>

<!-- spine_leaves -->
<rect class="tbl new" x="510" y="20" width="190" height="120"/>
<text class="hdr" x="605" y="42" text-anchor="middle" style="fill:#34d399">spine_leaves</text>
<text class="pk" x="520" y="60">leaf_id</text><text class="col" x="660" y="60">PK</text>
<text class="fk" x="520" y="76">call_id</text><text class="col" x="660" y="76">FK→calls</text>
<text class="col" x="520" y="92">step_id</text>
<text class="col" x="520" y="108">type: Sender / Expected</text>
<text class="col" x="520" y="124">content, wa_type, status</text>

<!-- spine_leaf_messages -->
<rect class="tbl junction" x="510" y="180" width="190" height="70"/>
<text class="hdr" x="605" y="202" text-anchor="middle" style="fill:#fbbf24">spine_leaf_messages</text>
<text class="fk" x="520" y="220">leaf_id</text><text class="col" x="640" y="220">FK→leaves</text>
<text class="fk" x="520" y="236">message_id</text><text class="col" x="640" y="236">FK→messages</text>

<!-- spine_events -->
<rect class="tbl new" x="510" y="290" width="190" height="70"/>
<text class="hdr" x="605" y="312" text-anchor="middle" style="fill:#34d399">spine_events</text>
<text class="col" x="520" y="330">call_id, phone_id</text>
<text class="col" x="520" y="346">event_type, data</text>

<!-- ── Relations ── -->
<!-- phones → contacts -->
<line class="rel" x1="100" y1="90" x2="100" y2="130"/>
<text class="label" x="108" y="114">1:N</text>

<!-- phones → phone_workers -->
<line class="rel" x1="80" y1="90" x2="80" y2="270"/>
<text class="label" x="88" y="190">1:1</text>

<!-- contacts → calls -->
<line class="rel" x1="180" y1="170" x2="240" y2="60"/>
<text class="label" x="200" y="108">1:N</text>

<!-- contacts → messages -->
<line class="rel" x1="180" y1="200" x2="240" y2="220"/>
<text class="label" x="206" y="206">1:N</text>

<!-- calls → messages (call_id) -->
<line class="rel rel-n" x1="340" y1="130" x2="340" y2="170"/>
<text class="label" x="348" y="154" style="fill:#10b981">1:N</text>

<!-- calls → spine_leaves -->
<line class="rel rel-n" x1="440" y1="70" x2="510" y2="70"/>
<text class="label" x="468" y="64" style="fill:#10b981">1:N</text>

<!-- spine_leaves → spine_leaf_messages -->
<line class="rel rel-nn" x1="605" y1="140" x2="605" y2="180"/>
<text class="label" x="613" y="164" style="fill:#f59e0b">N</text>

<!-- messages → spine_leaf_messages -->
<line class="rel rel-nn" x1="440" y1="240" x2="510" y2="220"/>
<text class="label" x="468" y="224" style="fill:#f59e0b">N</text>

<!-- Legend -->
<rect x="700" y="400" width="170" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
<text class="legend" x="714" y="420" font-weight="600" fill="#fff">מקרא</text>
<line x1="714" y1="434" x2="734" y2="434" stroke="#3b82f6" stroke-width="2"/>
<text class="legend" x="740" y="438">קיים</text>
<line x1="714" y1="454" x2="734" y2="454" stroke="#10b981" stroke-width="2"/>
<text class="legend" x="740" y="458">חדש</text>
<line x1="714" y1="474" x2="734" y2="474" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
<text class="legend" x="740" y="478">N:N junction</text>
<text class="legend" x="714" y="494" style="fill:#fbbf24">■ PK</text>
<text class="legend" x="760" y="494" style="fill:#a78bfa">■ FK</text>

</svg>
</body>
</html>
