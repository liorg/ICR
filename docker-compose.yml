version: "3.9"

networks:
  spine-net:
    driver: overlay
    attachable: true

volumes:
  registry_data:

services:
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    deploy:
      placement:
        constraints:
          - node.role == manager

  data-spine:
    # IMAGE_TAG מגיע מ-deploy.sh (SHA ב-CI, timestamp בהרצה ידנית).
    # ברירת המחדל latest נועדה ל-docker stack deploy ידני בלי הסקריפט.
    #
    # למה זה חשוב: תג נייד כמו latest גורם ל-Swarm לחשוב שהשירות כבר
    # מעודכן, ואז הפריסה "מצליחה" בזמן שרץ הקוד הישן. תג ייחודי הופך
    # כל פריסה לשינוי מפורש, ו-docker stack services מראה מה באמת רץ.
    image: ${REGISTRY_HOST}:5000/data-spine:${IMAGE_TAG:-latest}
    networks:
      - spine-net
    environment:
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"

      # מוחזר ב-GET /version. נצרב ל-image ב-build, וגם כאן כגיבוי.
      BUILD_TAG: "${IMAGE_TAG:-unknown}"

      # ── Workers → Spine (בתוך ה-overlay) ─────────────────────────────
      SPINE_SELF_URL: "http://scenario_data-spine:8000"

      # ── HostAgent → Spine ────────────────────────────────────────────
      # ה-HostAgent הוא systemd על מכונה נפרדת (10.186.0.2) ואינו ברשת
      # ה-overlay — הוא לא יכול לפתור "scenario_data-spine".
      # חייב להיות ה-IP של ה-Swarm + הפורט המפורסם (8001:8000 למטה).
      SPINE_CALLBACK_URL: "${SPINE_CALLBACK_URL:-http://10.186.0.3:8001}"

      # ── Spine → HostAgent ────────────────────────────────────────────
      HOST_AGENT_URL: "${HOST_AGENT_URL:-http://10.186.0.2:5000}"
      # הנתיב בקונטרולר השליחה. {phone_id} ו-{type} מוחלפים בזמן ריצה.
      HOST_AGENT_SEND_PATH: "${HOST_AGENT_SEND_PATH}"

      # ── רישום ה-webhook ──────────────────────────────────────────────
      # חייב להתאים בדיוק ל-WebhookRegistrationType.Trigger ב-HostAgent,
      # כי GetActiveWebhooksByTypeAsync מסנן לפי המחרוזת הזו בלבד.
      WEBHOOK_TYPE: "trigger"
      REGISTER_INTERVAL_SECONDS: "60"
    ports:
      - "8001:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first

  provisioner:
    image: ${REGISTRY_HOST}:5000/provisioner:${IMAGE_TAG:-latest}
    networks:
      - spine-net
    environment:
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"
      SWARM_NETWORK: "scenario_spine-net"
      SPINE_URL: "http://scenario_data-spine:8000"
      WORKER_IMAGE: "${WORKER_IMAGE:-liorgr/worker-scenario-runtime:sha-f952da6}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager

  scheduler:
    image: ${REGISTRY_HOST}:5000/scheduler:${IMAGE_TAG:-latest}
    networks:
      - spine-net
    environment:
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"
      SPINE_URL: "http://scenario_data-spine:8000"
      CHECK_INTERVAL_SECONDS: "30"

      # ── sweep: סגירת calls תקועים ────────────────────────────────────
      #
      # ה-Worker הוא היחיד שסוגר call בזרימה תקינה. אם הוא קרס,
      # ה-call נשאר running לנצח והקונטקט חסום: הודעות נכנסות מנותבות
      # ל-Worker שלא קיים, וכל trigger נדחה.
      #
      # ה-sweep סוגר לפי expected_end דרך spine_complete_call, כך
      # שגם התור מתקדם. חייב לפנות ל-Spine ולא ל-DB ישירות.
      SPINE_SWEEP_PATH: "${SPINE_SWEEP_PATH:-/api/calls/sweep}"
      SWEEP_STATUS: "${SWEEP_STATUS:-expired}"
      SWEEP_LIMIT: "${SWEEP_LIMIT:-50}"
      SWEEP_TIMEOUT_SECONDS: "${SWEEP_TIMEOUT_SECONDS:-60}"
      SLA_CHECK_SECONDS: "${SLA_CHECK_SECONDS:-60}"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
