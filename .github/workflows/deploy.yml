name: Deploy ICR

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: scenario-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: ".,!.git"
          target: "/opt/ICR"
          overwrite: true
          # ה-SCP נפל בעבר על i/o timeout בפורט 22.
          timeout: 60s
          command_timeout: 15m

      - name: Build and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          command_timeout: 20m
          # BUILD_TAG ייחודי לכל commit.
          #
          # תג latest גורם ל-Swarm לא למשוך image חדש — service update
          # מריץ את הישן וזה נראה כאילו הקוד לא השתנה. תג לפי SHA מבטיח
          # שכל פריסה היא image אחר, ו-/version מחזיר בדיוק מה רץ.
          envs: BUILD_TAG
          script: |
            cd /opt/ICR
            chmod +x deploy.sh
            BUILD_TAG="${BUILD_TAG}" ./deploy.sh
        env:
          BUILD_TAG: ${{ github.sha }}
